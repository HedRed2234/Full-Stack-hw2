<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакти</title>
  </head>
  <body>
    <header>
      <h1>Контакти</h1>

      <nav>
        <a href="index.html">Головна</a>
        <a href="contacts.html">Контакти</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Форма звернення</h2>

        <form>
          <p>
            <label for="name">Ім'я:</label><br />
            <input type="text" id="name" name="name" required />
          </p>

          <p>
            <label for="email">Електронна пошта:</label><br />
            <input type="email" id="email" name="email" required />
          </p>

          <p>
            <label for="subject">Тема звернення:</label><br />
            <select id="subject" name="subject" required>
              <option value="">Оберіть тему</option>
              <option value="question">Запитання</option>
              <option value="suggestion">Пропозиція</option>
              <option value="feedback">Відгук</option>
            </select>
          </p>

          <p>
            <label for="message">Повідомлення:</label><br />
            <textarea id="message" name="message" rows="6" required></textarea>
          </p>

          <button type="submit">Надіслати</button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Мої захоплення</p>
    </footer>
  </body>
</html>
